site_name: Cwtch
site_description: Python dataclasses with validation and views
repo_url: https://github.com/levsh/cwtch
edit_uri: ""

theme:
  language: en
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: light blue
  features:
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - mkdocstrings

nav:
  - Home: index.md
  - User Manual:
      - user-manual/dataclass.md
      - user-manual/field.md
      - user-manual/view.md
      - user-manual/validation.md
      - user-manual/types.md
      - user-manual/serialization.md
      - user-manual/config.md
  - API Reference:
      - api/cwtch.md
      - api/errors.md
      - api/types.md
      - api/metadata.md
